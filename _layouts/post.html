---
layout: wrapper
---
<article class="project-page"><header class="project-hero"><div class="project-meta"><a class="back" href="{{ '/projects.html' | relative_url }}">← Projets</a><h1>{{ page.title }}</h1><p class="project-lead">{{ page.description }}</p><div class="chips">{% for skill in page.skills %}<span>{{ skill }}</span>{% endfor %}</div></div>{% if page.main-image %}<div class="project-hero-image"><img src="{{ page.main-image | relative_url }}" alt="{{ page.title }}"></div>{% endif %}</header><div class="project-content">{{ content }}</div></article>
