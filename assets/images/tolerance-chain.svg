<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Axial tolerance chain</title><desc id="d">Shaft stack showing bearing, shoulder, pulley hub, spacer and end dimensions with worst-case reserve.</desc><rect width="1200" height="330" fill="#fff"/><style>.t{font:600 28px Arial,sans-serif;fill:#18212a}.s{font:18px Arial,sans-serif;fill:#4f5d68}.n{font:700 20px Arial,sans-serif;fill:#0e6b68}.b{stroke:#18212a;stroke-width:2;fill:#f6f8f9}.d{stroke:#215f86;stroke-width:2;fill:none}.a{fill:#215f86}</style><text x="50" y="48" class="t">Axial tolerance chain</text><text x="50" y="80" class="s">Reference shaft stack, total shaft length 160 mm</text><g transform="translate(70 125)"><rect class="b" x="0" y="0" width="125" height="70"/><rect class="b" x="125" y="0" width="95" height="70"/><rect class="b" x="220" y="0" width="230" height="70"/><rect class="b" x="450" y="0" width="160" height="70"/><rect class="b" x="610" y="0" width="125" height="70"/><rect class="b" x="735" y="0" width="125" height="70"/><text x="62" y="42" text-anchor="middle" class="s">Bearing</text><text x="172" y="42" text-anchor="middle" class="s">Shoulder</text><text x="335" y="42" text-anchor="middle" class="s">Pulley hub</text><text x="530" y="42" text-anchor="middle" class="s">Spacer</text><text x="672" y="42" text-anchor="middle" class="s">Bearing</text><text x="797" y="42" text-anchor="middle" class="s">End</text><line class="d" x1="0" y1="105" x2="860" y2="105"/><polygon class="a" points="0,105 15,97 15,113"/><polygon class="a" points="860,105 845,97 845,113"/><text x="430" y="135" text-anchor="middle" class="n">Worst-case reserved tolerance: 0.840 mm</text></g><g transform="translate(965 120)"><text x="0" y="0" class="s">Remaining axial margin</text><text x="0" y="44" class="t">41.41 mm</text><text x="0" y="80" class="s">Worst case</text><text x="0" y="125" class="n">Chain closes with margin</text></g></svg>