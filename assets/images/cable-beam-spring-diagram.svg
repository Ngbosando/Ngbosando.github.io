<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Seven-wire beam-spring model</title><desc id="d">Cross-section of one central wire and six outer wires connected by contact springs.</desc><rect width="800" height="520" fill="#fff"/><style>.t{font:600 28px Arial,sans-serif;fill:#18212a}.s{font:18px Arial,sans-serif;fill:#4f5d68}.w{fill:#f6f8f9;stroke:#18212a;stroke-width:4}.c{stroke:#215f86;stroke-width:5;fill:none}.l{font:700 18px Arial,sans-serif;fill:#0e6b68}</style><text x="40" y="48" class="t">Beam-spring reduced model</text><text x="40" y="78" class="s">42 DOF: wires represented by beams, contacts by springs</text><g transform="translate(400 300)"><g class="c"><line x1="0" y1="0" x2="0" y2="-150"/><line x1="0" y1="0" x2="130" y2="-75"/><line x1="0" y1="0" x2="130" y2="75"/><line x1="0" y1="0" x2="0" y2="150"/><line x1="0" y1="0" x2="-130" y2="75"/><line x1="0" y1="0" x2="-130" y2="-75"/><path d="M0,-150 Q65,-170 130,-75 Q170,0 130,75 Q65,170 0,150 Q-65,170 -130,75 Q-170,0 -130,-75 Q-65,-170 0,-150"/></g><circle class="w" r="55"/><circle class="w" cx="0" cy="-150" r="55"/><circle class="w" cx="130" cy="-75" r="55"/><circle class="w" cx="130" cy="75" r="55"/><circle class="w" cx="0" cy="150" r="55"/><circle class="w" cx="-130" cy="75" r="55"/><circle class="w" cx="-130" cy="-75" r="55"/></g><text x="625" y="225" class="l">wire beam</text><line x1="585" y1="235" x2="525" y2="265" class="c"/><text x="625" y="305" class="l">contact spring</text><line x1="585" y1="315" x2="520" y2="340" class="c"/></svg>