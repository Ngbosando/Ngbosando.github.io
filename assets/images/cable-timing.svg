<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Computation time comparison</title><desc id="d">Log-scale comparison of computation time for the 3D finite-element, FE-WFEM-GBMS and beam-spring models.</desc><rect width="900" height="430" fill="#fff"/><style>.t{font:600 28px Arial,sans-serif;fill:#18212a}.s{font:18px Arial,sans-serif;fill:#4f5d68}.v{font:700 22px Arial,sans-serif;fill:#0e6b68}.b{fill:#215f86}.g{stroke:#dce2e7;stroke-width:1}</style><text x="45" y="48" class="t">Computation time</text><text x="45" y="80" class="s">Same study, three modelling levels</text><line x1="180" y1="115" x2="180" y2="355" class="g"/><line x1="180" y1="355" x2="820" y2="355" class="g"/><text x="45" y="165" class="s">3D finite element</text><rect x="180" y="135" width="610" height="48" rx="5" class="b"/><text x="800" y="168" class="v">≈ 2,020 s</text><text x="45" y="245" class="s">FE-WFEM-GBMS</text><rect x="180" y="215" width="270" height="48" rx="5" class="b"/><text x="465" y="248" class="v">≈ 6.3 s</text><text x="45" y="325" class="s">Beam-spring</text><rect x="180" y="295" width="105" height="48" rx="5" class="b"/><text x="300" y="328" class="v">≈ 0.6 s</text></svg>