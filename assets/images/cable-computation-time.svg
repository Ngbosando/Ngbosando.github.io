<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Computation time comparison</title><desc id="d">Approximate computation times for the detailed 3D finite-element model, FE-WFEM-GBMS and beam-spring models.</desc><rect width="1200" height="650" fill="white"/><g font-family="Arial,sans-serif" fill="#18212a"><text x="70" y="70" font-size="34" font-weight="700">Computation time</text><text x="70" y="108" font-size="21" fill="#68737d">same modelling objective, three levels of fidelity</text></g><g transform="translate(90 155)" font-family="Arial,sans-serif"><line x1="0" y1="380" x2="1030" y2="380" stroke="#cfd8de" stroke-width="2"/><rect x="55" y="42" width="210" height="338" rx="12" fill="#18212a"/><rect x="410" y="327" width="210" height="53" rx="12" fill="#59798e"/><rect x="765" y="349" width="210" height="31" rx="12" fill="#9badb8"/><g text-anchor="middle" fill="#18212a"><text x="160" y="420" font-size="22" font-weight="700">3D FE</text><text x="515" y="420" font-size="22" font-weight="700">FE-WFEM-GBMS</text><text x="870" y="420" font-size="22" font-weight="700">Beam-spring</text></g><g text-anchor="middle" font-weight="700"><text x="160" y="29" font-size="30" fill="#18212a">≈ 2 022 s</text><text x="515" y="312" font-size="30" fill="#59798e">≈ 6.3 s</text><text x="870" y="334" font-size="30" fill="#7c919d">≈ 0.6 s</text></g><text x="515" y="500" text-anchor="middle" font-size="20" fill="#68737d">39 744 DOF  →  680 DOF  →  42 DOF</text></g></svg>