<section class="section" id="projects"><div class="section-heading"><span>Selected work</span><h2>Projects</h2></div><div class="project-grid">{% assign sorted = site.projects | sort: 'order' %}{% for project in sorted %}<a class="project-card" href="{{ project.url | relative_url }}"><div class="project-copy"><div class="project-index">0{{ project.order }}</div><h3>{{ project.title }}</h3><p>{{ project.description }}</p><div class="chips">{% for skill in project.skills limit:5 %}<span>{{ skill }}</span>{% endfor %}</div><div class="read-more">Read project →</div></div></a>{% endfor %}</div></section>
