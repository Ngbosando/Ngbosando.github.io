---
layout: wrapper
---
<section class="section page-list"><div class="section-heading"><span>Selected work</span><h1>Projects</h1></div><div class="project-grid">{% assign sorted = site.projects | sort: 'order' %}{% for project in sorted %}<a class="project-card" href="{{ project.url | relative_url }}"><div class="project-copy"><div class="project-index">0{{ project.order }}</div><h2>{{ project.title }}</h2><p>{{ project.description }}</p><div class="chips">{% for skill in project.skills %}<span>{{ skill }}</span>{% endfor %}</div></div></a>{% endfor %}</div></section>
